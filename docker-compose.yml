services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iyzico-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s


  api:
    build:
      context: .
      dockerfile: IyzicoDemo/Dockerfile

    container_name: iyzico-api

    depends_on:
      db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=IyzicoDemoDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"

      Stripe__ApiKey: ${IYZICO_API_KEY}
      Stripe__SecretKey: ${IYZICO_SECRET_KEY}
      Stripe__BaseUrl: "https://sandbox-api.iyzipay.com"

      Api__Authority: "http://localhost:5000"
      Api__Audience: "http://localhost:3000"
      Api__ValidIssuer: "http://localhost:5000"

    ports:
      - "5000:8080"


  frontend:
    build:
      context: ./iyzico-react-ui
      dockerfile: Dockerfile

    container_name: iyzico-frontend

    depends_on:
      - api

    ports:
      - "3000:80"


volumes:
  sqlserver_data: